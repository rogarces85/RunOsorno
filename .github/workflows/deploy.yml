name: Desplegar a Cloudflare Workers

on:
  push:
    branches: [main]
  # permite redesplegar sin subir un commit
  workflow_dispatch:

concurrency:
  # cancela el despliegue anterior si llega un commit nuevo
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verificar y desplegar
    runs-on: ubuntu-latest

    env:
      # Necesarios para que wrangler sepa a que cuenta subir.
      # Se definen como secretos del repositorio, no en el archivo.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 y no 22 a proposito: el package-lock.json lo genera npm 11
          # (el que viene con Node 24). Con Node 22 / npm 10, `npm ci` rehace el
          # arbol de otra forma y falla pidiendo `esbuild@0.28.2` y sus variantes
          # por plataforma, que el lock si tiene. Node 24 == el del desarrollo.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      # El build no necesita credenciales: `/login` es la unica ruta prerenderizada
      # y la conexion a la base se resuelve de forma perezosa en el primer uso
      # (ver `lib/db/index.ts`). Los secretos llegan en tiempo de ejecucion.
      - name: Build para Cloudflare Workers
        run: npx opennextjs-cloudflare build

      # OpenNext sube la caché incremental a R2 antes de publicar el Worker, y
      # desde los runners de GitHub esa subida falla por tiempo de espera de
      # forma intermitente ("Failed to send request to R2 worker: ... aborted due
      # to timeout"), lo que tumba el deploy entero. La caché es regenerable: si
      # falla, se reintenta el deploy y ya sale. Los reintentos cubren el fallo
      # sin dejar el sitio sin publicar.
      - name: Desplegar
        run: npx opennextjs-cloudflare deploy
        env:
          NODE_ENV: production

      - name: Reintentar el deploy si la subida de R2 dio tiempo de espera
        if: failure()
        run: npx opennextjs-cloudflare deploy
        env:
          NODE_ENV: production

      # La caché incremental de R2 guarda el HTML/RSC de despliegues anteriores.
      # OpenNext la puebla al desplegar pero nunca la limpia, así que se acumulan
      # artefactos de builds viejas. Purgarla tras cada despliegue es seguro: es
      # regenerable y se vuelve a llenar sola. Evita que queden referencias a
      # chunks que ya no existen (el error "components.ComponentMod.handler is
      # not a function", que devolvía 500 en peticiones nuevas).
      - name: Purgar la caché incremental de R2
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/runosorno-cache/objects"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          cursor=""
          borrados=0
          while : ; do
            url="${BASE}?per_page=1000"
            [ -n "${cursor}" ] && url="${url}&cursor=${cursor}"
            resp=$(curl -sS -H "${AUTH}" "${url}")
            if ! echo "${resp}" | jq -e '.success == true' > /dev/null; then
              echo "::warning::No se pudo listar la caché: $(echo "${resp}" | jq -c '.errors')"
              exit 0
            fi
            keys=$(echo "${resp}" | jq -r '.result.objects[]?.key')
            [ -z "${keys}" ] && break
            echo "${resp}" | jq -r '.result.objects[]?.key' | while read -r key; do
              encoded=$(printf '%s' "${key}" | jq -sRr @uri)
              curl -sS -X DELETE -H "${AUTH}" "${BASE}/${encoded}" > /dev/null
              echo "borrado ${key}"
            done
            borrados=$((borrados + $(echo "${keys}" | wc -l)))
            cursor=$(echo "${resp}" | jq -r '.result.cursor // empty')
            [ -z "${cursor}" ] && break
          done
          echo "Caché purgada: ${borrados} objetos"

      # Worker aparte, solo con un Cron Trigger, que mantiene caliente el
      # isolate del Worker principal (P1.5). No recibe tráfico de usuarios.
      - name: Desplegar el Worker de calentamiento
        run: npx wrangler deploy --config wrangler.calentamiento.jsonc